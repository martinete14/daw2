<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Interfaz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

  <header>
    <img src="logo.svg" alt="Logo de Interfaz" width="80" height="80">
    <h1>Interfaz</h1>
  </header>

  <main>
    <form action="#" method="post">
      <h2>Acceso</h2>

      <p>
        <label for="correo">Correo</label><br>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
      </p>

      <p>
        <label for="contrasena">Contraseña</label><br>
        <input type="password" id="contrasena" name="contrasena" required>
      </p>

      <p>
        <button type="submit" name="accion" value="iniciar">Iniciar sesión</button>
        <button type="submit" name="accion" value="registrar">Registrarse</button>
      </p>

      <p><a href="recuperar.html">¿Has olvidado tu contraseña?</a></p>
    </form>
  </main>

</body>
</html>
