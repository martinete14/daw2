<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Interfaz</title>
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo de Interfaz" width="80" height="80">
    <h1>Interfaz</h1>
  </header>

  <main>
    <form action="#" method="post">
      <h2>Recuperar contraseña</h2>
      <p>Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>

      <p>
        <label for="correo">Correo</label><br>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
      </p>

      <p>
        <button type="submit">Enviar enlace</button>
      </p>

      <p><a href="index.html">Volver a iniciar sesión</a></p>
    </form>
  </main>

</body>
</html>
