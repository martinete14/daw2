<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <div class="cabecera">
      <h1>Login SessionStorage</h1>
      <!-- si hay alguien logeado, su nombre sale arriba a la derecha -->
      <span class="usuario" id="usuario-cabecera"></span>
    </div>

    <div class="contenido">
      <form id="form-login">
        <p>Entrá con tu usuario (Riquelme / 1234, Robben / abcd, Palermo / boca)</p>

        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" required>
        </div>

        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" required>
        </div>

        <button type="submit" class="enviar">ENTRAR</button>
        <p class="error" id="error" hidden>Usuario o contraseña incorrectos.</p>
      </form>

      <div id="zona-usuario" hidden>
        <p class="ok" id="saludo"></p>

        <h2>Yerbas</h2>
        <p id="reglas"></p>
        <div class="productos" id="productos"></div>

        <h2>Carrito</h2>
        <ul class="resultados" id="carrito"></ul>
        <p id="total"></p>
        <p id="mensaje" hidden></p>

        <button id="comprar" class="enviar">Comprar</button>
        <button id="salir" class="enviar">Cerrar sesión</button>
      </div>
    </div>

    <div class="pie">
      <p>Martinete daw2 &middot; Desarrollo web en entorno cliente</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
