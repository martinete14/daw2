<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Martinete Yerbas</title>
  </head>
  <body>
    <div class="barra-top" id="reglas"></div>

    <header class="cabecera">
      <h1 class="logo">Martinete <span>Yerbas</span></h1>
      <!-- solo se ve si hay alguien logeado -->
      <div class="cabecera-derecha" id="cabecera-usuario" hidden>
        <div class="monedas">
          <button id="moneda-ars" class="activa">$ ARS</button>
          <button id="moneda-eur">€ EUR</button>
        </div>
        <span class="usuario" id="usuario-cabecera"></span>
        <span class="icono-carrito">🛒<span class="cantidad" id="cantidad-carrito">0</span></span>
        <button id="salir" class="boton-salir">Cerrar sesión</button>
      </div>
    </header>

    <main class="contenido">
      <form id="form-login" class="caja-login">
        <h2>Iniciar sesión</h2>
        <p>Usuarios de prueba: Riquelme / 1234, Robben / abcd, Palermo / boca</p>

        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" required>

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" required>

        <button type="submit" class="boton">ENTRAR</button>
        <p class="error" id="error" hidden>Usuario o contraseña incorrectos.</p>
      </form>

      <div id="zona-usuario" class="tienda" hidden>
        <section>
          <h2>Yerbas</h2>
          <div class="productos" id="productos"></div>
        </section>

        <aside class="carrito">
          <h2>Tu carrito</h2>
          <ul id="carrito"></ul>
          <p class="total" id="total"></p>
          <p id="mensaje" hidden></p>
          <button id="comprar" class="boton">Comprar</button>
        </aside>
      </div>
    </main>

    <footer class="pie">
      <p>Martinete daw2 &middot; Desarrollo web en entorno cliente</p>
      <p>Fotos y precios de referencia: Día Online</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
