<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Martinete Fútbol</title>
  </head>
  <body>
    <header class="cabecera">
      <h1 class="logo">Martinete <span>Fútbol</span></h1>
      <!-- botones para cambiar entre la tabla y las cards -->
      <div class="vistas">
        <button id="vista-lista" class="activa">LISTA</button>
        <button id="vista-cards">CARDS</button>
      </div>
    </header>

    <main class="contenido">
      <h2>Jugadores de la Liga Profesional</h2>
      <p id="mensaje" class="ok">Cargando jugadores...</p>

      <table id="tabla-jugadores">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Club</th>
            <th>Posición</th>
            <th>Nacionalidad</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>

      <div id="cards" class="cards" hidden></div>
    </main>

    <footer class="pie">
      <p>Martinete daw2 &middot; Desarrollo web en entorno cliente</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
